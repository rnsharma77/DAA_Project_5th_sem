<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Algorithm Visualizer</title>
    <!-- Load Tailwind CSS from CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Link External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen p-4 sm:p-8">

    <div class="max-w-7xl mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-white mb-2">Sorting Algorithm Visualizer</h1>
            <p class="text-purple-300">Watch how different sorting algorithms work in real-time</p>
        </div>

        <!-- Controls and Stats Container -->
        <div class="bg-white/10 backdrop-blur-lg rounded-xl p-4 sm:p-6 mb-6 shadow-2xl">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                
                <!-- Algorithm Selector -->
                <div>
                    <label for="algorithm-select" class="block text-white text-sm font-semibold mb-2">Algorithm</label>
                    <select
                        id="algorithm-select"
                        class="w-full bg-white/20 text-white rounded-lg px-4 py-2 border border-white/30 focus:outline-none focus:ring-2 focus:ring-purple-500 disabled:opacity-50"
                    >
                        <!-- Options will be populated by JS -->
                    </select>
                </div>

                <!-- Array Size Range -->
                <div>
                    <label id="array-size-label" class="block text-white text-sm font-semibold mb-2">
                        Array Size: 50
                    </label>
                    <input
                        type="range"
                        id="array-size-range"
                        min="10"
                        max="100"
                        value="50"
                        class="w-full h-2 bg-white/20 rounded-lg appearance-none cursor-pointer disabled:opacity-50"
                    />
                </div>

                <!-- Speed Range -->
                <div>
                    <label id="speed-label" class="block text-white text-sm font-semibold mb-2">
                        Speed: 50
                    </label>
                    <input
                        type="range"
                        id="speed-range"
                        min="1"
                        max="100"
                        value="50"
                        class="w-full h-2 bg-white/20 rounded-lg appearance-none cursor-pointer"
                    />
                </div>

                <!-- Action Buttons -->
                <div class="flex items-end gap-2">
                    <button
                        id="start-stop-btn"
                        class="flex-1 bg-purple-600 hover:bg-purple-700 disabled:bg-gray-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-lg"
                    >
                        <i data-lucide="play" class="w-4 h-4"></i>
                        <span>Start</span>
                    </button>
                    <button
                        id="new-array-btn"
                        class="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors shadow-lg"
                    >
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Stats Display -->
            <div class="grid grid-cols-2 gap-4 mt-4">
                <div class="bg-white/10 rounded-lg p-4">
                    <div class="flex items-center gap-2 text-purple-300 mb-1">
                        <i data-lucide="zap" class="w-4 h-4"></i>
                        <span class="font-semibold">Comparisons</span>
                    </div>
                    <p id="comparisons-count" class="text-2xl sm:text-3xl font-bold text-white">0</p>
                </div>
                <div class="bg-white/10 rounded-lg p-4">
                    <div class="flex items-center gap-2 text-purple-300 mb-1">
                        <i data-lucide="timer" class="w-4 h-4"></i>
                        <span class="font-semibold">Swaps</span>
                    </div>
                    <p id="swaps-count" class="text-2xl sm:text-3xl font-bold text-white">0</p>
                </div>
            </div>
        </div>

        <!-- Visualization Area -->
        <div id="visualizer-container" class="bg-white/10 backdrop-blur-lg rounded-xl p-4 sm:p-6 shadow-2xl" style="height: 500px;">
            <div id="bar-visualization" class="bar-container">
                <!-- Bars will be rendered here by JS -->
            </div>
        </div>

        <!-- Algorithm Info -->
        <div class="mt-6 bg-white/10 backdrop-blur-lg rounded-xl p-6">
            <h2 class="text-xl font-bold text-white mb-3">Algorithm Information</h2>
            <div class="text-purple-200 space-y-2">
                <p>
                    <strong class="text-white">Current Algorithm:</strong> 
                    <span id="current-algo-name">Bubble Sort</span>
                </p>
                <p>
                    <strong class="text-white">Time Complexity:</strong> 
                    <span id="current-algo-complexity">O(n²)</span>
                </p>
                <p class="text-sm mt-3">
                    <strong class="text-white">Legend:</strong>
                    <span class="inline-block w-4 h-4 bg-blue-500 mx-2 rounded"></span>Unsorted
                    <span class="inline-block w-4 h-4 bg-red-500 mx-2 rounded"></span>Comparing
                    <span class="inline-block w-4 h-4 bg-green-500 mx-2 rounded"></span>Sorted
                </p>
            </div>
        </div>
    </div>

    <!-- Link External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
